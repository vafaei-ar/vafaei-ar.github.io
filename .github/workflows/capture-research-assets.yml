name: Capture authentic research visuals
on:
  push:
    branches:
      - authentic-research-visuals-20261123
    paths:
      - '.qa/build_vera_screenshots.cjs'
      - '.qa/download_microscopy.py'
      - '.github/workflows/capture-research-assets.yml'
permissions:
  contents: write
jobs:
  render-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot test tools
        run: |
          npm install --no-save playwright@1.56.1
          google-chrome --version
      - name: Check out actual public VERA Cloud frontend
        run: |
          git clone --filter=blob:none https://github.com/vafaei-ar/VERA-cloud.git .qa/VERA-cloud
          cd .qa/VERA-cloud
          git checkout b8c1939e1b6ebd0e3aec0423d163a0d0e0720679
      - name: Capture actual software UI with fictional examples
        run: node .qa/build_vera_screenshots.cjs
      - name: Install image processing
        run: python -m pip install --quiet pillow
      - name: Download original CC BY 4.0 microscopy from publisher and crop panel 2a
        id: microscope
        continue-on-error: true
        run: python .qa/download_microscopy.py
      - name: Commit visual assets to preview branch
        run: |
          test -s assets/media/vera-setup.png
          test -s assets/media/vera-conversation.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/
          if ! git diff --cached --quiet; then
            git commit -m "Capture authentic software and histopathology assets [skip ci]"
            git push origin HEAD:authentic-research-visuals-20261123
          fi
