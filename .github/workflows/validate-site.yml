name: Validate static research website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site and published data
        run: node scripts/validate_site.cjs
      - name: Check JavaScript syntax
        run: node --check assets/research.js
